name: probe
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  before:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/rate_limit | jq -c .resources.core
      - run: sleep 5; curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/rate_limit | jq -c .resources.core
  selfref1:
    needs: before
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/rate_limit | jq -c .resources.core
      - uses: arimendelow/actions-token-probe-private/.github/actions/noop@47842b52f8777080bdf905263fc16327d4275a99
      - run: curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/rate_limit | jq -c .resources.core
  selfref2:
    needs: selfref1
    runs-on: ubuntu-latest
    steps:
      - uses: arimendelow/actions-token-probe-private/.github/actions/noop@47842b52f8777080bdf905263fc16327d4275a99
      - run: curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/rate_limit | jq -c .resources.core
  after:
    needs: selfref2
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/rate_limit | jq -c .resources.core
